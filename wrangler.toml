name = "divinus-whatsapp-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Endereço do webhook: https://divinus-whatsapp-bot.<sua-conta>.workers.dev/webhook
workers_dev = true

[vars]
WA_PHONE_NUMBER_ID = "1447325711786652"   # (91) 98128-4102, número do bot da Divinus
GRAPH_VERSION = "v26.0"
TEAM_EMAIL = "divinustechsolucoes@gmail.com"
FROM_EMAIL = "bot@divinustecnologia.com.br"

# E-mail para a equipe (usa o Email Routing já configurado no domínio)
[[send_email]]
name = "TEAM_MAIL"
destination_address = "divinustechsolucoes@gmail.com"

# Uma "Conversa" por cliente: histórico + lembretes agendados
[[durable_objects.bindings]]
name = "CONVERSA"
class_name = "Conversa"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Conversa"]

[observability]
enabled = true

# Painel da equipe: índice das conversas
[[durable_objects.bindings]]
name = "PAINEL"
class_name = "Painel"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Painel"]
